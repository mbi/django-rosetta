[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-rosetta"
dynamic = ["version"]
description = "A Django application that eases the translation of Django projects"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marco Bonetti", email = "mbonetti@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Internationalization",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]
dependencies = [
    "Django>=4.2",
    "requests>=2.30.0",
    "polib>=1.1.0",
]

[project.optional-dependencies]
test = ["vcrpy", "tox>=4.31"]
docs = ["sphinx", "sphinx-book-theme"]

[project.urls]
Homepage = "https://github.com/mbi/django-rosetta"
Repository = "https://github.com/mbi/django-rosetta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rosetta*"]
namespaces = false
exclude = ["testproject", "testproject.*"]

[tool.setuptools.dynamic]
version = { attr = "rosetta.__version__" }

# Lint + format: ruff replaces flake8, black and (for import ordering) isort.
[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [
    "build",
    "dist",
    "docs",
    "node_modules",
    "migrations",
    "south_migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.isort]
profile = "black"
lines_after_imports = 2
multi_line_output = 3
order_by_type = true
known_django = "django"
known_django_third_party = "django_*"
known_first_party = "apps,rosetta"
sections = "FUTURE,STDLIB,THIRDPARTY,DJANGO,DJANGO_THIRD_PARTY,FIRSTPARTY,LOCALFOLDER"
skip_glob= "**/migrations/**"
